<style>
:root{--bg:#141617;--card:#1d1f22;--br:#2e3135;--tx:#f2f3f5;--mu:#9aa0a6;--ac:#198fd9;--ok:#65bd7d;--er:#ff6b6b;--wa:#f5b942}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:'Open Sans',Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 28px}
.logo{display:block;margin:4px auto 14px;max-width:240px;width:70%;height:auto}
.logoTxt{text-align:center;font-weight:700;letter-spacing:3px;font-size:15px;margin:6px 0 16px}
.bar{display:flex;justify-content:flex-end;margin-bottom:6px}
.lang{display:flex;border:1px solid var(--br);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mu);font:600 12px 'Open Sans',sans-serif;padding:6px 12px;cursor:pointer}
.lang button.on{background:var(--tx);color:var(--bg)}
h1{font-size:22px;font-weight:700;text-align:center;line-height:1.25;margin-bottom:6px}
.intro{color:var(--mu);text-align:center;font-size:14px;line-height:1.5;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:16px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mu);letter-spacing:.3px;margin:12px 0 6px}
label.f:first-child{margin-top:0}
input[type=text],input[type=tel],input[type=email],input[type=date]{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--br);border-radius:10px;padding:13px 12px;font:16px 'Open Sans',sans-serif;outline:none;color-scheme:dark}
input:focus{border-color:var(--ac)}
input:disabled{opacity:.35}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--tx);margin-top:8px;cursor:pointer;line-height:1.4}
.chk input{width:20px;height:20px;flex-shrink:0;accent-color:var(--ac);margin-top:1px}
.hint{font-size:13px;color:var(--wa);margin-top:6px}
.hint a{color:var(--wa);font-weight:700;cursor:pointer;text-decoration:underline}
.privacy{font-size:11.5px;color:var(--mu);line-height:1.5;margin:6px 0 0 30px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.btn{display:block;width:100%;margin-top:18px;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:15px;font:700 16px 'Open Sans',sans-serif;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.err{background:rgba(255,107,107,.12);border:1px solid var(--er);color:var(--er);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:14px;line-height:1.4}
.done{text-align:center;padding:36px 12px}
.done .big{font-size:46px;margin-bottom:10px;color:var(--ok)}
.done p{font-size:17px;line-height:1.5}
.done small{display:block;color:var(--mu);margin-top:14px;font-size:13px}
.msg{text-align:center;color:var(--mu);padding:40px 12px;font-size:15px;line-height:1.5}
.test{background:var(--wa);color:#000;font-weight:700;font-size:12px;text-align:center;border-radius:8px;padding:6px;margin-bottom:12px}
.pend{text-align:center;font-size:12px;color:var(--wa);margin-top:12px}
</style>
</head>

  }

  function payload() {
    var hp = document.getElementById('website');
    return { subId: state.subId, lang: lang, name: vals.name, phone: vals.phone, email: vals.email,
      eventDate: vals.noDate ? '' : vals.eventDate, noDate: vals.noDate, venue: vals.noVenue ? '' : vals.venue, noVenue: vals.noVenue,
      consent: vals.consent, channel: KIOSK ? 'kiosk' : 'web', website: hp ? hp.value : '' };
  }

  function submit() {
    if (state.busy) return;
    if (!String(vals.name).trim() || !String(vals.phone).trim() || !String(vals.email).trim() ||
        (!vals.noDate && !vals.eventDate) || (!vals.noVenue && !String(vals.venue).trim())) { state.err = t('req'); render(); return; }
    var d = payload();
    state.busy = true; state.err = ''; render();
    call('submitLeadForm', [CODE, d]).then(function () {
      state.busy = false; state.done = true; state.offline = false; render(); afterDone();
    }, function (e) {
      state.busy = false;
      if (e && e.net && KIOSK) {   // περίπτερο: κρατάμε την καταχώρηση και πάμε στο επόμενο ζευγάρι
        var a = queue(); a.push(d); setQueue(a);
        state.done = true; state.offline = true; render(); afterDone();
      } else { state.err = e && e.net ? t('net') : (e && e.message) || 'Error'; render(); }
    });
  }
  function afterDone() { if (KIOSK) setTimeout(reset, 6000); }

  // Ουρά χωρίς internet (μόνο tablet): ξαναστέλνει μία-μία. Λάθος δεδομένων → πετιέται (δεν θα περάσει ποτέ).
  var flushing = false;
  function flush() {
    var a = queue();
    if (flushing || !a.length || !CODE) return;
    flushing = true;
    call('submitLeadForm', [CODE, a[0]]).then(function () { setQueue(queue().slice(1)); flushing = false; render(); flush(); },
      function (e) { if (e && !e.net) setQueue(queue().slice(1)); flushing = false; if (e && !e.net) { render(); flush(); } });
  }

  function load() {
    if (!CODE) { cfg = { found: false, texts: {} }; render(); return; }
    call('getLeadFormPublic', [CODE]).then(function (c) {
      cfg = c || { found: false };
      if (!cfg.texts) cfg.texts = {};
      render();
      if (KIOSK) { flush(); setInterval(flush, 20000); }
    }, function () {
      app.innerHTML = '<div class="msg">' + t('net') + '</div>';
      setTimeout(load, 8000);
    });
  }
  window.addEventListener('online', flush);
  window.addEventListener('resize', postHeight);
  load();
})();
</script>
</body>
</html>
